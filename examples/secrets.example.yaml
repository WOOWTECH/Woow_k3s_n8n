# -----------------------------------------------------------------------------
# Secret for Woow_k3s_n8n - PLACEHOLDERS ONLY. Never commit real values.
#
# Used with the default secrets.create=false: the chart only references this
# Secret by name (values.existingSecret). Copy this file OUTSIDE the repo,
# replace every REPLACE_ME value, then apply that copy:
#   kubectl --context woow-k3s apply -f /secure/path/n8n-secrets.yaml
#
# The running Secrets on woow-k3s (n8n-secrets, cindytech-n8n-secrets) also
# carry N8N_API_KEY and MCP_AUTH_TOKEN, left over from the in-cluster n8n-MCP
# sidecar. This chart does not read or require them - n8n-MCP is now its own
# chart/release in WOOWTECH/woow_n8n_mcp_server, which documents them.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: REPLACE_ME_NAMESPACE
type: Opaque
stringData:
  # n8n's own basic-auth password (N8N_BASIC_AUTH_USER is set in values, not here).
  N8N_BASIC_AUTH_PASSWORD: "REPLACE_ME_password"
  # Encrypts credentials stored in n8n's SQLite database. SET ONCE, NEVER
  # ROTATE. Generate with: openssl rand -hex 32
  N8N_ENCRYPTION_KEY: "REPLACE_ME_generate-with-openssl-rand-hex-32"
