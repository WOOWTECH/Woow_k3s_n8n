{{- /*
Rendered only with secrets.create=true (fresh-install/test convenience).
By default the chart never renders or touches a Secret: it only references
existingSecret, so an upgrade can never overwrite real credentials.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "n8n.fullname" . }}-secrets
  namespace: {{ include "n8n.namespace" . }}
  {{- include "n8n.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  N8N_BASIC_AUTH_PASSWORD: {{ required "secrets.basicAuthPassword is required when secrets.create=true" .Values.secrets.basicAuthPassword | quote }}
  N8N_ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required when secrets.create=true" .Values.secrets.encryptionKey | quote }}
{{- end }}
