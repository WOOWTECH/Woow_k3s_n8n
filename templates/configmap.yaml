---
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: {{ .Values.namespace.name }}
  labels:
    app: n8n
data:
  # ── n8n configuration ─────────────────────────────────────────────
{{- range $key, $value := .Values.n8n.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
  # ── n8n-mcp configuration ─────────────────────────────────────────
{{- range $key, $value := .Values.mcp.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
