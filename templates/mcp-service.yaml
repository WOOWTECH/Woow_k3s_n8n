{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-mcp
  namespace: {{ .Values.namespace.name }}
  labels:
    app: n8n
    component: n8n-mcp
spec:
  type: {{ .Values.mcp.service.type }}
  selector:
    app: n8n
    component: n8n-mcp
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.mcp.service.port }}
      targetPort: http
      {{- if eq .Values.mcp.service.type "NodePort" }}
      nodePort: {{ .Values.mcp.service.nodePort }}
      {{- end }}
{{- end }}
