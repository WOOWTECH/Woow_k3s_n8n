# Instance values for cindytech's n8n (Helm release `cindytech-n8n`, namespace
# `cindytech`, adopted from a kubectl-applied Deployment/Service/PVC named
# cindytech-n8n / cindytech-n8n-svc / cindytech-n8n-pvc).
#
# NO SECRETS HERE: with secrets.create=false (the chart default) the chart only
# references the existing Secret `cindytech-n8n-secrets`. It also has
# N8N_API_KEY and MCP_AUTH_TOKEN keys left over from the in-cluster n8n-MCP
# sidecar; this chart does not read or need them (n8n-MCP is now its own
# chart/release - see WOOWTECH/woow_n8n_mcp_server).
#
# Reproduce the live objects (must render identically, see scripts/check-drift.sh):
#   helm template cindytech-n8n . -n cindytech -f deploy/woow-k3s/cindytech.yaml --skip-tests
#
# Take over the running kubectl-applied objects without restarting them:
#   helm --kube-context woow-k3s upgrade --install cindytech-n8n . -n cindytech \
#     -f deploy/woow-k3s/cindytech.yaml --take-ownership
#
# SAFETY: this file intentionally does NOT set `namespace:`. Object placement
# is controlled ENTIRELY by `-n`/`--namespace` on the command above. Never add
# a `namespace:` key here (or to any other file under deploy/woow-k3s/) - the
# `n8n.namespace` helper lets a values-file `namespace:` silently win over
# `-n`, so a `-n <test-ns> -f deploy/woow-k3s/cindytech.yaml` rehearsal would
# otherwise write to the REAL `cindytech` namespace instead of the test one.
# This file is already a fixed one-release-per-namespace mapping
# (`fullnameOverride: cindytech-n8n` + this exact pod spec only ever runs in
# `cindytech`), so `-n` alone is sufficient and safe to vary for a rehearsal
# in a test namespace.

fullnameOverride: cindytech-n8n

existingSecret: cindytech-n8n-secrets
keepOnUninstall: true

# PINNED 2026-09-13. This is the digest that was ALREADY RUNNING at pin time,
# so applying it is a version no-op - the restart it costs changes nothing about
# which n8n build serves users. It replaces ":latest" + pullPolicy: Always,
# under which every restart silently pulled whatever ":latest" pointed at that
# day. On 2026-09-13 the three builds in play were all different: this instance
# ran 882b126a8ddd, the other instance ran a second build, and Docker
# Hub's ":latest" was a third one - so a restart was an unannounced upgrade.
# IfNotPresent serves it from the node cache (pre-pulled onto every eligible
# node), so a restart no longer depends on Docker Hub being reachable, which
# matters because pulls from this cluster intermittently fail with
# "net/http: TLS handshake timeout".
#
# To upgrade n8n deliberately: pick the new digest, pre-pull it onto every node
# the pod may land on, update `digest` here, then `helm upgrade`.
image:
  repository: n8nio/n8n
  tag: latest
  digest: sha256:882b126a8ddd0646e7d17ec47630e7704615e4647f3363471859fddc3f8946e2
  pullPolicy: IfNotPresent

replicas: 1

# NOTE: these objects used to carry `app.kubernetes.io/managed-by: kubectl`.
# They are Helm releases now, and Helm stamps `managed-by: Helm` onto anything
# it adopts, so re-declaring the old value made the chart and Helm fight over
# the same label on every upgrade. It is declared as `Helm` below rather than
# just dropped, so the rendered manifest states the true value explicitly
# instead of depending on Helm's implicit stamping. The label is metadata only
# (not the selector, not the pod template), so it never restarts anything.
labels:
  selector:
    app.kubernetes.io/component: n8n
    app.kubernetes.io/name: cindytech
  deployment:
    app.kubernetes.io/component: n8n
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cindytech
    app.kubernetes.io/part-of: cindytech

strategy:
  type: Recreate

# Pod-template annotations. `kubectl rollout restart` stamps restartedAt into
# the STORED pod template, so it is part of the live pod-template hash and must
# be reproduced verbatim - otherwise a `--take-ownership` upgrade would strip it
# and roll the Deployment. Value as of the last check against the live object;
# refresh it (scripts/check-drift.sh) after any future `kubectl rollout restart`.
podAnnotations:
  kubectl.kubernetes.io/restartedAt: "2026-06-24T17:38:42+08:00"

automountServiceAccountToken: false

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsUser: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

port: 5678
portName: http

# EXACT env order of the live Deployment - order is load-bearing (see
# values.yaml). Do not reorder without a rehearsed takeover check.
env:
  - name: N8N_HOST
    value: "0.0.0.0"
  - name: N8N_PORT
    value: "5678"
  - name: N8N_PROTOCOL
    value: https
  - name: N8N_WEBHOOK_URL
    value: https://cindytech1-n8n.woowtech.io/
  - name: N8N_BASIC_AUTH_ACTIVE
    value: "true"
  - name: N8N_BASIC_AUTH_USER
    value: admin
  - name: N8N_BASIC_AUTH_PASSWORD
    valueFromSecret: N8N_BASIC_AUTH_PASSWORD
  - name: N8N_ENCRYPTION_KEY
    valueFromSecret: N8N_ENCRYPTION_KEY
  - name: GENERIC_TIMEZONE
    value: Asia/Taipei
  - name: NODE_ENV
    value: production
  - name: NODE_OPTIONS
    value: --max-old-space-size=4096
  - name: EXECUTIONS_TIMEOUT
    value: "300"
  - name: EXECUTIONS_TIMEOUT_MAX
    value: "600"

probes:
  liveness:
    httpGet:
      path: /healthz
      port: 5678
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
  readiness:
    httpGet:
      path: /healthz
      port: 5678
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  startup:
    httpGet:
      path: /healthz
      port: 5678
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "3"
    memory: 6Gi

initContainer:
  enabled: true
  image: busybox:1.36
  pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 0
  resources:
    limits:
      cpu: 50m
      memory: 32Mi

persistence:
  claimName: cindytech-n8n-pvc
  storageClassName: longhorn
  size: 5Gi
  labels:
    app.kubernetes.io/component: n8n
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cindytech

service:
  name: cindytech-n8n-svc
  labels:
    app.kubernetes.io/component: n8n
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cindytech

tests:
  enabled: true
