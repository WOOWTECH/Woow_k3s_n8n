# Default values for the n8n chart.
#
# There is no built-in "single-tenant" shape here: every live n8n on woow-k3s
# was hand-applied with kubectl and each has its own object names, labels and
# pod-spec details (probes, securityContext, nodeSelector, strategy...). The
# defaults below describe a plain, reasonably-hardened fresh install; each
# running instance's *exact* shape is restated in its own file under
# deploy/woow-k3s/, which a fresh `helm template` must reproduce field for
# field (see scripts/check-drift.sh).
#
# The n8n-MCP sidecar and its nginx proxy are NOT part of this chart. They are
# their own chart/release per instance in WOOWTECH/woow_n8n_mcp_server.

# "" = the release namespace (-n). Only set this to install into a namespace
# different from -n; the chart never creates a Namespace object either way.
namespace: ""

nameOverride: ""
fullnameOverride: ""

# Existing Secret with keys N8N_BASIC_AUTH_PASSWORD and N8N_ENCRYPTION_KEY.
# Required unless secrets.create=true. The chart only reads it - see
# examples/secrets.example.yaml for every key a running instance may also
# store there (N8N_API_KEY, MCP_AUTH_TOKEN, ...); this chart never uses those.
existingSecret: ""

secrets:
  # Fresh-install/test convenience only: renders a Secret from the values
  # below instead of requiring existingSecret. Never used for a live instance.
  create: false
  basicAuthPassword: ""
  encryptionKey: ""

# helm.sh/resource-policy: keep on the PVC and on the Secret this chart
# creates (secrets.create=true only) so `helm uninstall` never deletes data.
keepOnUninstall: true

image:
  repository: n8nio/n8n
  tag: latest
  # Matches Kubernetes' own default pull behaviour for a ":latest" tag.
  pullPolicy: Always

replicas: 1

basicAuth:
  active: true
  user: admin

labels:
  # Deployment selector AND pod-template labels. REQUIRED - has no default on
  # purpose: Helm deep-merges map values, so a non-empty default here would
  # silently union itself into a values file that means to replace it wholly
  # (e.g. `{app: n8n}` leaking into `{app.kubernetes.io/name: cindytech}` and
  # producing a *different* selector than either side intended). Fixed for
  # the life of the release: changing it recreates the ReplicaSet and
  # restarts every pod. e.g. `{app: n8n}`.
  selector: {}
  # Extra labels merged onto the Deployment's own metadata.labels only
  # (not the selector or the pod template). {} renders no `labels:` key.
  deployment: {}

# Deployment-level annotations (metadata.annotations), e.g. for adoption notes.
annotations: {}

strategy:
  type: RollingUpdate
  # {} lets the API server fill in its own default (25%/25%) - only set this
  # when an instance needs a non-default value.
  rollingUpdate: {}

# true (default) omits the field, matching Kubernetes' own default.
automountServiceAccountToken: true

# Raw pass-through maps (rendered with `toYaml`, nothing added or defaulted).
# {} omits the field so the API server's own default applies.
nodeSelector: {}
podSecurityContext: {}
containerSecurityContext: {}

# "" lets the API server default it (30s).
terminationGracePeriodSeconds: ""

port: 5678
# "" omits the container/service port `name` field.
portName: ""

# Extra container env entries appended after the two secret-backed ones
# (N8N_BASIC_AUTH_PASSWORD, N8N_ENCRYPTION_KEY). Each entry is either
# {name, value} or {name, valueFrom: {...}}, rendered as-is.
extraEnv:
  - name: GENERIC_TIMEZONE
    value: Asia/Taipei
  - name: N8N_HOST
    value: "0.0.0.0"
  - name: N8N_PORT
    value: "5678"
  - name: N8N_PROTOCOL
    value: http
  - name: NODE_ENV
    value: production
  - name: N8N_WEBHOOK_URL
    value: "http://localhost:5678/"
  - name: NODE_OPTIONS
    value: --max-old-space-size=2048

# Raw k8s probe objects (httpGet/initialDelaySeconds/...). {} disables.
probes:
  liveness: {}
  readiness: {}
  startup: {}

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

initContainer:
  # `chown -R 1000:1000` on the data volume before n8n starts.
  enabled: true
  image: busybox:1.36
  pullPolicy: IfNotPresent
  env: []
  resources: {}
  securityContext: {}

persistence:
  # "" = "<fullname>-data"
  claimName: ""
  # Test default (Longhorn "longhorn-delete" reclaims volumes on delete); a
  # live instance overrides this to "longhorn" in its own deploy/ values.
  storageClassName: longhorn-delete
  size: 5Gi
  accessMode: ReadWriteOnce
  labels: {}

service:
  # "" = "<fullname>"
  name: ""
  type: ClusterIP
  labels: {}

tests:
  # `helm test` smoke pod: GET /healthz. Read-only.
  enabled: true
