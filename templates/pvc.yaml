apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "n8n.pvcName" . }}
  namespace: {{ include "n8n.namespace" . }}
  {{- with .Values.persistence.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- include "n8n.keepAnnotations" . | nindent 2 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  storageClassName: {{ .Values.persistence.storageClassName }}
