apiVersion: v2
name: n8n
description: >-
  n8n workflow automation on K3s/Kubernetes. One release per instance
  (SQLite on a PVC, an existing Secret for credentials); no namespace or
  Secret is owned by the chart, so it can adopt an already-running
  kubectl-applied n8n without restarting it. The n8n-MCP sidecar is no
  longer part of this chart: it is its own chart and release in
  WOOWTECH/woow_n8n_mcp_server.
type: application
version: 2.1.0
appVersion: "latest"
kubeVersion: ">=1.24.0-0"
keywords:
  - n8n
  - workflow
  - automation
home: https://github.com/WOOWTECH/Woow_k3s_n8n
sources:
  - https://github.com/WOOWTECH/Woow_k3s_n8n
  - https://github.com/n8n-io/n8n
maintainers:
  - name: WoowTech
    url: https://github.com/WOOWTECH
